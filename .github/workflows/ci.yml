name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/train.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate training configuration
        run: |
          python - <<'PY'
          import yaml

          with open("configs/training_config.yaml", encoding="utf-8") as config_file:
              config = yaml.safe_load(config_file)

          required_sections = {"model", "data", "training", "output"}
          missing_sections = required_sections - config.keys()
          if missing_sections:
              raise SystemExit(f"Missing configuration sections: {sorted(missing_sections)}")
          PY

      - name: Run tests
        run: python -m pytest -q
